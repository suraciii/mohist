variables:
  agent:
    type: opencode

stages:
  - stage: prepare
    tasks:
      - id: publish-branch
        title: Publish branch to GitHub
        uses: core/script
        with:
          run: git push origin HEAD

  - stage: plan
    requiresApproval: true
    tasks:
      - id: proposal
        title: Generate proposal
        uses: mohist/acp-agent
        with:
          session: plan
          prompt: ${{ prompts.proposal }}
          agent: ${{ vars.agent }}
          expect:
            files:
              - path: ${{ openspecChangeDir }}/proposal.md
      - id: specs
        title: Write specs
        uses: mohist/acp-agent
        with:
          session: plan
          prompt: ${{ prompts.specs }}
          agent: ${{ vars.agent }}
          expect:
            files:
              - path: ${{ openspecChangeDir }}/specs
      - id: design
        title: Create design
        uses: mohist/acp-agent
        with:
          session: plan
          prompt: ${{ prompts.design }}
          agent: ${{ vars.agent }}
          expect:
            files:
              - path: ${{ openspecChangeDir }}/design.md
      - id: tasks
        title: Generate tasks
        uses: mohist/acp-agent
        with:
          session: plan
          prompt: ${{ prompts.tasks }}
          agent: ${{ vars.agent }}
          expect:
            files:
              - path: ${{ openspecChangeDir }}/tasks.json
      - id: self-review
        title: Self review
        uses: mohist/acp-agent
        with:
          session: plan
          prompt: ${{ prompts.self-review }}
          agent: ${{ vars.agent }}
          expect:
            files:
              - path: ${{ openspecChangeDir }}/self-review.md
      - id: push-plan
        title: Push plan to GitHub
        uses: core/script
        with:
          run: git push origin HEAD
    checks:
      - name: proposal-complete
        title: Proposal complete
        uses: core/artifact-exists
        with:
          path: ${{ openspecChangeDir }}/proposal.md
      - name: specs-complete
        title: Specs complete
        uses: core/artifact-exists
        with:
          path: ${{ openspecChangeDir }}/specs
      - name: design-complete
        title: Design complete
        uses: core/artifact-exists
        with:
          path: ${{ openspecChangeDir }}/design.md
      - name: tasks-valid
        title: Tasks valid
        uses: core/artifact-exists
        with:
          path: ${{ openspecChangeDir }}/tasks.json
      - name: self-review-passed
        title: Self review passed
        uses: core/marker
        with:
          path: ${{ openspecChangeDir }}/self-review.md
          expect: <promise>PASS</promise>
        repairLimit: 1
        repairTask:
          id: fix-plan-review
          title: Fix plan review findings
          uses: mohist/acp-agent
          with:
            session: plan
            prompt: |
              Fix the plan review findings in ${{ openspecChangeDir }}.
              Update proposal.md, specs, design.md, tasks.json, or self-review.md as needed.
            agent: ${{ vars.agent }}
      - name: health
        title: Health
        uses: core/script
        with:
          run: git diff --check
          timeout: 300000

  - stage: build
    tasks:
      - id: load-tasks
        title: Load tasks from plan
        uses: mohist/openspec-tasks
        with:
          path: ${{ openspecChangeDir }}/tasks.json
          task:
            uses: mohist/acp-agent
            with:
              agent: ${{ vars.agent }}
              prompt:
                uses: mohist/openspec-task-prompt
                with:
                  file: ${{ openspecChangeDir }}/tasks.json
                  items: tasks
                  base: ${{ prompts.build }}
      - id: push-build
        title: Push build to GitHub
        uses: core/script
        with:
          run: git push origin HEAD
    checks:
      - name: health
        title: Health
        uses: core/script
        with:
          run: git diff --check
          timeout: 300000
        repairLimit: 1
        repairTask:
          id: fix-build-health
          title: Fix build health
          uses: mohist/acp-agent
          with:
            session: build
            prompt: |
              Fix the build-stage health failure reported by `git diff --check`.
              Keep changes focused on whitespace and patch formatting issues.
            agent: ${{ vars.agent }}

  - stage: check
    requiresApproval: true
    tasks:
      - id: ai-review
        title: AI review
        uses: mohist/acp-agent
        with:
          session: check
          prompt: ${{ prompts.review }}
          agent: ${{ vars.agent }}
          expect:
            files:
              - path: ${{ openspecChangeDir }}/review.md
      - id: push-check
        title: Push check to GitHub
        uses: core/script
        with:
          run: git push origin HEAD
    checks:
      - name: health
        title: Health
        uses: core/script
        with:
          run: git diff --check
          timeout: 300000
        repairLimit: 1
        repairTask:
          id: fix-check-health
          title: Fix check health
          uses: mohist/acp-agent
          with:
            session: check
            prompt: |
              Fix the check-stage health failure reported by `git diff --check`.
              Keep changes focused on whitespace and patch formatting issues.
            agent: ${{ vars.agent }}
      - name: review-passed
        title: Review passed
        uses: core/marker
        with:
          path: ${{ openspecChangeDir }}/review.md
          expect: <promise>PASS</promise>
        repairLimit: 2
        repairTask:
          id: fix-review-findings
          title: Fix review findings
          uses: mohist/acp-agent
          with:
            session: check
            prompt: ${{ prompts.auto-fix }}
            agent: ${{ vars.agent }}
        verifyTask:
          id: ai-review
          title: AI review
          uses: mohist/acp-agent
          with:
            session: check
            prompt: ${{ prompts.review }}
            agent: ${{ vars.agent }}
            expect:
              files:
                - path: ${{ openspecChangeDir }}/review.md

  - stage: integrate
    lockBehavior: sequential
    resources:
      - project-integration
    tasks:
      - id: push-integrate
        title: Push to GitHub
        uses: core/script
        with:
          run: git push origin HEAD
      - id: github-pr
        title: Create and merge PR
        uses: mohist/github-pr
        with:
          source: mo/issue-${{ issue.number }}
          target: ${{ project.baseBranch }}
          title: ${{ issue.title }}
          token: ${{ github.token }}
      - id: pull-merged
        title: Pull merged changes
        uses: core/script
        with:
          run: |
            git fetch origin
            git checkout ${{ project.baseBranch }}
            git pull origin ${{ project.baseBranch }}
      - id: spec-sync
        title: Sync specs
        uses: mohist/openspec-sync
        with:
          changeDir: ${{ openspecChangeDir }}
      - id: archive-change
        title: Archive change
        uses: mohist/archive-change
        with:
          changeDir: ${{ openspecChangeDir }}
    checks:
      - name: health
        title: Health
        uses: core/script
        with:
          run: git diff --check
          timeout: 300000
        repairLimit: 1
        repairTask:
          id: fix-integrate-health
          title: Fix integrate health
          uses: mohist/acp-agent
          with:
            session: integrate
            prompt: |
              Fix the integrate-stage health failure reported by `git diff --check`.
              Keep changes focused on whitespace and patch formatting issues.
            agent: ${{ vars.agent }}
