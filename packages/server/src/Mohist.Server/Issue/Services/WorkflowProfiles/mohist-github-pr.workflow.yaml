description: |
  Default general-purpose Mohist pipeline that delivers through a GitHub PR: plan (proposal, specs, design, tasks, self-review, open draft PR) → build (load tasks, verify) → check (AI review, push, mark PR ready) → integrate (archive, push, merge PR).
  Requires human approval at the plan and check stages. The workflow opens a draft PR as the last plan task, marks it ready after the check stage approves it, and squash-merges it into the repository base branch on integrate completion.
  Typical duration: 20-60 minutes for a focused change.
  Choose this over mohist/local when you want each issue to ship as a reviewable, traceable GitHub PR.
  Not suited for: trivial one-line fixes, throwaway spikes, or quick experiments — these don't warrant a full plan-check-integrate cycle.
  Requires the `gh` CLI on the runner host and `gh auth login` against the target repository.

variables:
  agent:
    type: opencode

approval:
  feedback:
    task:
      id: apply-feedback
      title: Apply approval feedback
      uses: mohist/acp-agent
      with:
        session: ${{ stage.name }}
        prompt: ${{ prompts.apply-feedback }}

stages:
  - stage: plan
    requiresApproval: true
    tasks:
      - id: workspace-prepare
        title: Prepare workspace
        uses: mohist/workspace-prepare
      - id: proposal
        title: Generate proposal
        uses: mohist/acp-agent
        with:
          session: plan
          prompt: ${{ prompts.proposal }}
          agent: ${{ vars.agent }}
        expect:
          files:
            - path: ${{ openspecChangeDir }}/proposal.md
        artifacts:
          files:
            - path: ${{ openspecChangeDir }}/proposal.md

      - id: specs
        title: Write specs
        uses: mohist/acp-agent
        with:
          session: plan
          prompt: ${{ prompts.specs }}
          agent: ${{ vars.agent }}
        artifacts:
          files:
            - path: ${{ openspecChangeDir }}/specs

      - id: design
        title: Create design
        uses: mohist/acp-agent
        with:
          session: plan
          prompt: ${{ prompts.design }}
          agent: ${{ vars.agent }}
        expect:
          files:
            - path: ${{ openspecChangeDir }}/design.md
        artifacts:
          files:
            - path: ${{ openspecChangeDir }}/design.md

      - id: tasks
        title: Generate tasks
        uses: mohist/acp-agent
        with:
          session: plan
          prompt: ${{ prompts.tasks }}
          agent: ${{ vars.agent }}
        expect:
          files:
            - path: ${{ openspecChangeDir }}/tasks.json
        artifacts:
          files:
            - path: ${{ openspecChangeDir }}/tasks.json

      - id: self-review
        title: Self review
        uses: mohist/acp-agent
        with:
          session: plan
          prompt: ${{ prompts.self-review }}
          agent: ${{ vars.agent }}
          expect:
            markers:
              - path: ${{ openspecChangeDir }}/self-review.md
                oneOf:
                  - <promise>PASS</promise>
                  - <promise>FAIL</promise>
                failIf: <promise>FAIL</promise>
        recovery:
          budget: 2
          handlers:
            - when: promise=FAIL
              tasks:
                - id: recover:fix-plan-review
                  title: Fix plan review findings
                  uses: mohist/acp-agent
                  with:
                    session: plan
                    prompt: ${{ prompts.fix-plan-review }}
                    agent: ${{ vars.agent }}
              retrySelf: true
        artifacts:
          files:
            - path: ${{ openspecChangeDir }}/self-review.md

      - id: open-draft-pr
        title: Open draft GitHub PR
        uses: mohist/create-github-pr
        with:
          source: ${{ workspace.branch }}
          target: ${{ repository.baseBranch }}
          remote: origin
          draft: true
          titleFrom: issue.title
          bodyFrom: issue.body
        setVars:
          github.pr.number: output.prNumber
          github.pr.url: output.prUrl

    checks:
      - name: plan-artifacts
        title: Plan artifacts complete
        uses: mohist/openspec-artifacts
        with:
          changeDir: ${{ openspecChangeDir }}

  - stage: build
    tasks:
      - id: workspace-prepare
        title: Prepare workspace
        uses: mohist/workspace-prepare
      - id: load-tasks
        title: Load tasks from plan
        uses: mohist/openspec-tasks
        with:
          path: ${{ openspecChangeDir }}/tasks.json
          task:
            uses: mohist/acp-agent
            with:
              agent: ${{ vars.agent }}
              prompt:
                uses: mohist/openspec-task-prompt
                with:
                  file: ${{ openspecChangeDir }}/tasks.json
                  items: tasks
                  base: ${{ prompts.build }}
      - id: verify
        title: Build & full test suite
        uses: core/script
        with:
          run: ${{ vars.ci.verify }}
          timeout: 1500000
        recovery:
          budget: 2
          handlers:
            - when: errorCode=script-failed
              tasks:
                - id: recover:fix-tests
                  title: Fix failing tests/build
                  uses: mohist/acp-agent
                  with:
                    session: build
                    prompt: ${{ prompts.fix-tests }}
                    agent: ${{ vars.agent }}
              retrySelf: true
    checks: []

  - stage: check
    requiresApproval: true
    tasks:
      - id: workspace-prepare
        title: Prepare workspace
        uses: mohist/workspace-prepare
      - id: ai-review
        title: AI review
        uses: mohist/acp-agent
        with:
          session: check
          prompt: ${{ prompts.review }}
          agent: ${{ vars.agent }}
          expect:
            markers:
              - path: ${{ openspecChangeDir }}/review.md
                oneOf:
                  - <promise>PASS</promise>
                  - <promise>FAIL</promise>
                failIf: <promise>FAIL</promise>
        recovery:
          budget: 2
          handlers:
            - when: promise=FAIL
              tasks:
                - id: recover:fix-review-findings
                  title: Fix review findings
                  uses: mohist/acp-agent
                  with:
                    session: check
                    prompt: ${{ prompts.auto-fix }}
                    agent: ${{ vars.agent }}
              retrySelf: true
        artifacts:
          files:
            - path: ${{ openspecChangeDir }}/review.md

      - id: push
        title: Push
        uses: mohist/push
        with:
          source: ${{ workspace.branch }}
          target: ${{ workspace.branch }}
          remote: origin
          forceWithLease: true

      - id: mark-pr-ready
        title: Mark GitHub PR ready
        uses: mohist/mark-github-pr-ready
        with:
          prNumber: ${{ vars.github.pr.number }}

    checks:
      - name: github-pr-status
        title: GitHub PR status
        uses: mohist/github-pr-status
        with:
          prNumber: ${{ vars.github.pr.number }}

  - stage: integrate
    lockBehavior: sequential
    resources:
      - project-integration
    tasks:
      - id: workspace-prepare
        title: Prepare workspace
        uses: mohist/workspace-prepare
      - id: archive-change
        title: Archive change
        uses: mohist/archive-change
        with:
          changeDir: ${{ openspecChangeDir }}
        recovery:
          budget: 3
          handlers:
            - when: errorCode=retry-safe
              retrySelf: true

      - id: push
        title: Push
        uses: mohist/push
        with:
          source: ${{ workspace.branch }}
          target: ${{ workspace.branch }}
          remote: origin
          forceWithLease: true

      - id: merge-pr
        title: Merge GitHub PR
        uses: mohist/merge-github-pr
        with:
          prNumber: ${{ vars.github.pr.number }}
          method: squash
        recovery:
          budget: 2
          handlers:
            - when: errorCode=base-moved
              tasks:
                - id: recover:rebase
                  title: Rebase after base moved
                  uses: mohist/rebase
                  with:
                    baseBranch: ${{ repository.baseBranch }}
                    remote: origin
                    squash: false
                  recovery:
                    budget: 2
                    handlers:
                      - when: errorCode=conflict
                        tasks:
                          - id: recover:resolve-rebase-conflicts
                            title: Resolve rebase conflicts
                            uses: mohist/acp-agent
                            with:
                              session: integrate
                              prompt: ${{ prompts.resolve-rebase-conflicts }}
                              agent: ${{ vars.agent }}
                - id: recover:push
                  title: Push
                  uses: mohist/push
                  with:
                    source: ${{ workspace.branch }}
                    target: ${{ workspace.branch }}
                    remote: origin
                    force: true
              retrySelf: true
            - when: errorCode=pr-checks-failed
              tasks:
                - id: recover:fix-pr-checks
                  title: Fix failing GitHub PR checks
                  uses: mohist/acp-agent
                  with:
                    session: integrate
                    prompt: ${{ prompts.fix-pr-checks }}
                    agent: ${{ vars.agent }}
                - id: recover:push
                  title: Push
                  uses: mohist/push
                  with:
                    source: ${{ workspace.branch }}
                    target: ${{ workspace.branch }}
                    remote: origin
                    forceWithLease: true
              retrySelf: true
            - when: errorCode=protection-conflict
              retrySelf: true

    checks:
      - name: merge-verified
        title: Merge verified
        uses: mohist/github-pr-status
        with:
          prNumber: ${{ vars.github.pr.number }}
          expect: merged
