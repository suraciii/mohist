variables:
  agent:
    type: opencode

stages:
  - stage: plan
    requiresApproval: true
    tasks:
      - id: proposal
        title: Generate proposal
        uses: mohist/acp-agent
        with:
          session: plan
          prompt: ${{ prompts.proposal }} 
          agent: ${{ vars.agent }}
          expect:
            files:
              - path: ${{ openspecChangeDir }}/proposal.md
      - id: specs
        title: Write specs
        uses: mohist/acp-agent
        with:
          session: plan
          prompt: ${{ prompts.specs }}
          agent: ${{ vars.agent }}
          expect:
            files:
              - path: ${{ openspecChangeDir }}/specs
      - id: design
        title: Create design
        uses: mohist/acp-agent
        with:
          session: plan
          prompt: ${{ prompts.design }}
          agent: ${{ vars.agent }}
          expect:
            files:
              - path: ${{ openspecChangeDir }}/design.md
      - id: tasks
        title: Generate tasks
        uses: mohist/acp-agent
        with:
          session: plan
          prompt: ${{ prompts.tasks }}
          agent: ${{ vars.agent }}
          expect:
            files:
              - path: ${{ openspecChangeDir }}/tasks.json
      - id: self-review
        title: Self review
        uses: mohist/acp-agent
        with:
          session: plan
          prompt: ${{ prompts.self-review }}
          agent: ${{ vars.agent }}
          expect:
            files:
              - path: ${{ openspecChangeDir }}/self-review.md
            markers:
              - path: ${{ openspecChangeDir }}/self-review.md
                contains: PASS
    checks:
      - name: proposal-complete
        title: Proposal complete
        uses: core/artifact-exists
        with:
          path: ${{ openspecChangeDir }}/proposal.md
      - name: specs-complete
        title: Specs complete
        uses: core/artifact-exists
        with:
          path: ${{ openspecChangeDir }}/specs
      - name: design-complete
        title: Design complete
        uses: core/artifact-exists
        with:
          path: ${{ openspecChangeDir }}/design.md
      - name: tasks-valid
        title: Tasks valid
        uses: core/artifact-exists
        with:
          path: ${{ openspecChangeDir }}/tasks.json
      - name: self-review-passed
        title: Self review passed
        uses: core/marker
        with:
          path: ${{ openspecChangeDir }}/self-review.md
          expect: PASS
        retryLimit: 1
        retryTask:
          id: fix-plan-review
          title: Fix plan review findings
          uses: mohist/acp-agent
          with:
            session: plan
            prompt: |
              Fix the plan review findings in ${{ openspecChangeDir }}.
              Update proposal.md, specs, design.md, tasks.json, or self-review.md as needed.
            agent: ${{ vars.agent }}
      - name: health
        title: Health
        uses: core/script
        with:
          run: git diff --check
          timeout: 300000

  - stage: build
    tasks:
      - id: load-tasks
        title: Load tasks from plan
        uses: mohist/openspec-tasks
        with:
          path: ${{ openspecChangeDir }}/tasks.json
          task:
            with:
              agent: ${{ vars.agent }}
    checks:
      - name: health
        title: Health
        uses: core/script
        with:
          run: git diff --check
          timeout: 300000
        retryLimit: 1
        retryTask:
          id: fix-build-health
          title: Fix build health
          uses: mohist/acp-agent
          with:
            session: build
            prompt: |
              Fix the build-stage health failure reported by `git diff --check`.
              Keep changes focused on whitespace and patch formatting issues.
            agent: ${{ vars.agent }}

  - stage: check
    requiresApproval: true
    tasks:
      - id: ai-review
        title: AI review
        uses: mohist/acp-agent
        with:
          session: check
          prompt: ${{ prompts.review }}
          agent: ${{ vars.agent }}
          expect:
            files:
              - path: ${{ openspecChangeDir }}/review.md
    checks:
      - name: health
        title: Health
        uses: core/script
        with:
          run: git diff --check
          timeout: 300000
        retryLimit: 1
        retryTask:
          id: fix-check-health
          title: Fix check health
          uses: mohist/acp-agent
          with:
            session: check
            prompt: |
              Fix the check-stage health failure reported by `git diff --check`.
              Keep changes focused on whitespace and patch formatting issues.
            agent: ${{ vars.agent }}
      - name: review-passed
        title: Review passed
        uses: core/marker
        with:
          path: ${{ openspecChangeDir }}/review.md
          expect: PASS
        retryLimit: 2
        retryTask:
          id: ai-re-review
          title: AI re-review
          uses: mohist/acp-agent
          with:
            session: check
            prompt: ${{ prompts.review }}
            expect:
              files:
                - path: ${{ openspecChangeDir }}/review.md
            agent: ${{ vars.agent }}
      - name: merge-ready
        title: Merge ready
        uses: mohist/merge-ready

  - stage: integrate
    tasks:
      - id: integrate:spec-sync
        title: Sync specs
        uses: mohist/openspec-sync
        with:
          changeDir: ${{ openspecChangeDir }}
      - id: integrate:archive-change
        title: Archive change
        uses: mohist/archive-change
        with:
          changeDir: ${{ openspecChangeDir }}
      - id: integrate:merge
        title: Merge branch
        uses: mohist/merge
        with:
          source: mo/issue-${{ issue.number }}
          target: ${{ project.baseBranch }}
          strategy: squash
          message: Complete issue #${{ issue.number }}
    checks:
      - name: health
        title: Health
        uses: core/script
        with:
          run: git diff --check
          timeout: 300000
        retryLimit: 1
        retryTask:
          id: fix-integrate-health
          title: Fix integrate health
          uses: mohist/acp-agent
          with:
            session: integrate
            prompt: |
              Fix the integrate-stage health failure reported by `git diff --check`.
              Keep changes focused on whitespace and patch formatting issues.
            agent: ${{ vars.agent }}
