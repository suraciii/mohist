approval:
  feedback:
    tasks:
      - id: apply-feedback
        title: Apply approval feedback
        uses: mohist/opencode
        with:
          session: ${{ stage.name }}
          prompt: ${{ prompts.apply-feedback }}
          options: ${{ vars.agent }}

stages:
  - stage: plan
    requiresApproval: true
    tasks:
      - id: workspace-prepare
        title: Prepare workspace
        uses: mohist/workspace-prepare
        with:
          expectedBranch: ${{ workspace.branch }}
      - id: proposal
        title: Generate proposal
        uses: mohist/opencode
        with:
          session: plan
          prompt: ${{ prompts.proposal }}
          options: ${{ vars.agent }}
        expect:
          files:
            - path: openspec/changes/issue-${{ issue.number }}/proposal.md
        artifacts:
          files:
            - path: openspec/changes/issue-${{ issue.number }}/proposal.md
      - id: specs
        title: Write specs
        uses: mohist/opencode
        with:
          session: plan
          prompt: ${{ prompts.specs }}
          options: ${{ vars.agent }}
        artifacts:
          files:
            - path: openspec/changes/issue-${{ issue.number }}/specs
      - id: design
        title: Create design
        uses: mohist/opencode
        with:
          session: plan
          prompt: ${{ prompts.design }}
          options: ${{ vars.agent }}
        expect:
          files:
            - path: openspec/changes/issue-${{ issue.number }}/design.md
        artifacts:
          files:
            - path: openspec/changes/issue-${{ issue.number }}/design.md
      - id: tasks
        title: Generate tasks
        uses: mohist/opencode
        with:
          session: plan
          prompt: ${{ prompts.tasks }}
          options: ${{ vars.agent }}
        expect:
          files:
            - path: openspec/changes/issue-${{ issue.number }}/tasks.json
        artifacts:
          files:
            - path: openspec/changes/issue-${{ issue.number }}/tasks.json
      - id: self-review
        title: Self review
        uses: mohist/opencode
        with:
          session: plan
          prompt: ${{ prompts.self-review }}
          options: ${{ vars.agent }}
        expect:
          markers:
            - path: openspec/changes/issue-${{ issue.number }}/self-review.md
              oneOf:
                - <promise>PASS</promise>
                - <promise>FAIL</promise>
              failIf: <promise>FAIL</promise>
        recovery:
          budget: 1
          handlers:
            - when: output.promise=FAIL
              tasks:
                - id: recover:fix-plan-review
                  title: Fix plan review findings
                  uses: mohist/opencode
                  with:
                    session: plan
                    prompt: ${{ prompts.fix-plan-review }}
                    options: ${{ vars.agent }}
              retrySelf: true
        artifacts:
          files:
            - path: openspec/changes/issue-${{ issue.number }}/self-review.md
    checks:
      - name: plan-artifacts
        title: Plan artifacts complete
        uses: mohist/openspec-artifacts
        with:
          changeDir: openspec/changes/issue-${{ issue.number }}
      - name: health
        title: Health
        uses: core/script
        with:
          run: git diff --check
          timeout: 300000

  - stage: build
    tasks:
      - id: workspace-prepare
        title: Prepare workspace
        uses: mohist/workspace-prepare
        with:
          expectedBranch: ${{ workspace.branch }}
      - id: load-tasks
        title: Load tasks from plan
        uses: mohist/openspec-tasks
        with:
          path: openspec/changes/issue-${{ issue.number }}/tasks.json
          task:
            uses: mohist/opencode
            with:
              options: ${{ vars.agent }}
              prompt:
                uses: mohist/openspec-task-prompt
                with:
                  file: openspec/changes/issue-${{ issue.number }}/tasks.json
                  items: tasks
                  base: ${{ prompts.build }}
      - id: build-health
        title: Health
        uses: core/script
        with:
          run: git diff --check
          timeout: 300000
        recovery:
          budget: 1
          handlers:
            - when: error.code=script-failed
              tasks:
                - id: recover:fix-build-health
                  title: Fix build health
                  uses: mohist/opencode
                  with:
                    session: build
                    prompt: |
                      Fix the build-stage health failure reported by `git diff --check`.
                      Keep changes focused on whitespace and patch formatting issues.
                    options: ${{ vars.agent }}
              retrySelf: true
      - id: verify
        title: Build & full test suite
        uses: core/script
        with:
          run: ${{ vars.ci.verify }}
          timeout: 300000
        recovery:
          budget: 2
          handlers:
            - tasks:
                - id: recover:fix-ci
                  title: Fix CI verification
                  uses: mohist/opencode
                  with:
                    session: build
                    prompt: ${{ prompts.fix-ci }}
                    options: ${{ vars.agent }}
                  expect:
                    markers:
                      - path: _output
                        oneOf:
                          - <promise>done</promise>
                          - <promise>unfinished</promise>
              retrySelf: true
    checks: []



  - stage: check
    requiresApproval: true
    tasks:
      - id: workspace-prepare
        title: Prepare workspace
        uses: mohist/workspace-prepare
        with:
          expectedBranch: ${{ workspace.branch }}
      - id: ai-review
        title: AI review
        uses: mohist/opencode
        with:
          session: check
          prompt: ${{ prompts.review }}
          options: ${{ vars.agent }}
        expect:
          markers:
            - path: openspec/changes/issue-${{ issue.number }}/review.md
              oneOf:
                - <promise>PASS</promise>
                - <promise>FAIL</promise>
              failIf: <promise>FAIL</promise>
        recovery:
          budget: 2
          handlers:
            - when: output.promise=FAIL
              tasks:
                - id: recover:fix-review-findings
                  title: Fix review findings
                  uses: mohist/opencode
                  with:
                    session: check
                    prompt: ${{ prompts.auto-fix }}
                    options: ${{ vars.agent }}
              retrySelf: true
        artifacts:
          files:
            - path: openspec/changes/issue-${{ issue.number }}/review.md
      - id: check-health
        title: Health
        uses: core/script
        with:
          run: git diff --check
          timeout: 300000
        recovery:
          budget: 1
          handlers:
            - when: error.code=script-failed
              tasks:
                - id: recover:fix-check-health
                  title: Fix check health
                  uses: mohist/opencode
                  with:
                    session: check
                    prompt: |
                      Fix the check-stage health failure reported by `git diff --check`.
                      Keep changes focused on whitespace and patch formatting issues.
                    options: ${{ vars.agent }}
              retrySelf: true
      - id: merge-ready
        title: Merge ready
        uses: mohist/merge-ready
        with:
          baseBranch: ${{ repository.baseBranch }}
          source: ${{ workspace.branch }}
          remote: origin
        recovery:
          budget: 1
          handlers:
            - when: canMerge=false
              tasks:
                - id: recover:rebase-onto-base
                  title: Rebase onto base branch
                  uses: mohist/rebase
                  with:
                    baseBranch: ${{ repository.baseBranch }}
                    remote: origin
                  recovery:
                    budget: 2
                    handlers:
                      - when: error.code=conflict
                        tasks:
                          - id: recover:resolve-rebase-conflicts
                            title: Resolve rebase conflicts
                            uses: mohist/opencode
                            with:
                              session: check
                              prompt: ${{ prompts.resolve-rebase-conflicts }}
                              options: ${{ vars.agent }}
              retrySelf: true
    checks: []



  - stage: integrate
    lockBehavior: sequential
    resources:
      - project-integration
    tasks:
      - id: workspace-prepare
        title: Prepare workspace
        uses: mohist/workspace-prepare
        with:
          expectedBranch: ${{ workspace.branch }}
      - id: integrate:archive-change
        title: Archive change
        uses: mohist/archive-change
        with:
          changeDir: openspec/changes/issue-${{ issue.number }}
          archiveHint: ${{ vars.archive }}
        recovery:
          budget: 3
          handlers:
            - when: error.code=retry-safe
              retrySelf: true
      - id: integrate:rebase
        title: Rebase and squash branch
        uses: mohist/rebase
        with:
          baseBranch: ${{ repository.baseBranch }}
          remote: origin
          squash: true
          messageFrom: issue.title
        recovery:
          budget: 2
          handlers:
            - when: error.code=conflict
              tasks:
                - id: recover:resolve-rebase-conflicts
                  title: Resolve rebase conflicts
                  uses: mohist/opencode
                  with:
                    session: integrate
                    prompt: ${{ prompts.resolve-rebase-conflicts }}
                    options: ${{ vars.agent }}
      - id: integrate:push
        title: Push changes
        uses: mohist/push
        with:
          source: ${{ workspace.branch }}
          target: ${{ repository.baseBranch }}
          remote: origin
      - id: integrate:health
        title: Health
        uses: core/script
        with:
          run: git diff --check
          timeout: 300000
        recovery:
          budget: 1
          handlers:
            - when: error.code=script-failed
              tasks:
                - id: recover:fix-integrate-health
                  title: Fix integrate health
                  uses: mohist/opencode
                  with:
                    session: integrate
                    prompt: |
                      Fix the integrate-stage health failure reported by `git diff --check`.
                      Keep changes focused on whitespace and patch formatting issues.
                    options: ${{ vars.agent }}
              retrySelf: true
    checks: []
