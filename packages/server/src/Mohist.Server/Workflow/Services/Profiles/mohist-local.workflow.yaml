approval:
  feedback:
    tasks:
    - id: apply-feedback
      title: Apply approval feedback
      uses: mohist/agent
      with:
        name: mohist/builder
        session: feedback-${{ stage.name }}
        prompt: ${{ prompts.apply-feedback }}
recoveries:
  rebase-conflicts:
    budget: 2
    handlers:
    - when: error.code=conflict
      tasks:
      - id: recover:resolve-rebase-conflicts
        title: Resolve rebase conflicts
        uses: mohist/agent
        with:
          name: mohist/builder
          session: check
          prompt: ${{ prompts.resolve-rebase-conflicts }}
      retrySelf: false
stages:
- stage: plan
  requiresApproval: true
  tasks:
  - id: workspace-prepare
    title: Prepare workspace
    uses: mohist/workspace-prepare
    with:
      expectedBranch: ${{ workspace.branch }}
      working-directory: REPOS/${{ repository.name }}
  - id: plan
    title: Plan the change
    uses: mohist/agent
    with:
      name: mohist/planner
      session: plan
      prompt: ${{ prompts.plan }}
    expect:
      files:
      - path: PLANS/PLAN.md
      - path: PLANS/DESIGN.md
      - path: PLANS/tasks.json
    artifacts:
      files:
      - path: PLANS/PLAN.md
      - path: PLANS/DESIGN.md
      - path: PLANS/tasks.json
  checks:
  - id: health
    title: Health
    uses: core/script
    with:
      run: git diff --check
      timeout: 300000
      working-directory: REPOS/${{ repository.name }}
- stage: build
  tasks:
  - id: workspace-prepare
    title: Prepare workspace
    uses: mohist/workspace-prepare
    with:
      expectedBranch: ${{ workspace.branch }}
      working-directory: REPOS/${{ repository.name }}
  - id: load-tasks
    title: Load tasks from plan
    uses: mohist/task-list
    with:
      path: PLANS/tasks.json
      task:
        uses: mohist/agent
        with:
          name: mohist/builder
          timeout: 1800000
  - id: build-health
    title: Health
    uses: core/script
    with:
      run: git diff --check
      timeout: 300000
      working-directory: REPOS/${{ repository.name }}
    recovery:
      budget: 1
      handlers:
      - when: error.code=script-failed
        tasks:
        - id: recover:fix-build-health
          title: Fix build health
          uses: mohist/agent
          with:
            name: mohist/builder
            session: build
            prompt: 'Fix the build-stage health failure reported by `git diff --check`.

              Keep changes focused on whitespace and patch formatting issues.

              '
        retrySelf: true
  - id: verify
    title: Verify
    uses: core/script
    with:
      run: ${{ workflow.verification.command }}
      timeout: 900000
      working-directory: REPOS/${{ repository.name }}
    recovery:
      budget: 2
      handlers:
      - when: error.code=script-failed
        tasks:
        - id: recover:fix-ci
          title: Fix CI verification
          uses: mohist/agent
          with:
            name: mohist/builder
            session: build
            prompt: ${{ prompts.fix-ci }}
          expect:
            markers:
            - path: _output
              oneOf:
              - <promise>done</promise>
              - <promise>unfinished</promise>
        retrySelf: true
      - when: error.code=timeout
        tasks:
        - id: recover:fix-ci
          title: Fix CI verification
          uses: mohist/agent
          with:
            name: mohist/builder
            session: build
            prompt: ${{ prompts.fix-ci }}
          expect:
            markers:
            - path: _output
              oneOf:
              - <promise>done</promise>
              - <promise>unfinished</promise>
        retrySelf: true
  checks: []
- stage: check
  requiresApproval: true
  tasks:
  - id: workspace-prepare
    title: Prepare workspace
    uses: mohist/workspace-prepare
    with:
      expectedBranch: ${{ workspace.branch }}
      working-directory: REPOS/${{ repository.name }}
  - id: ai-review
    title: AI review
    uses: mohist/agent
    with:
      name: mohist/reviewer
      session: check
      prompt: ${{ prompts.review }}
    expect:
      files:
      - path: PLANS/REVIEW.md
    artifacts:
      files:
      - path: PLANS/REVIEW.md
  - id: check-health
    title: Health
    uses: core/script
    with:
      run: git diff --check
      timeout: 300000
      working-directory: REPOS/${{ repository.name }}
    recovery:
      budget: 1
      handlers:
      - when: error.code=script-failed
        tasks:
        - id: recover:fix-check-health
          title: Fix check health
          uses: mohist/agent
          with:
            name: mohist/reviewer
            session: check
            prompt: 'Fix the check-stage health failure reported by `git diff --check`.

              Keep changes focused on whitespace and patch formatting issues.

              '
        retrySelf: true
  - id: merge-ready
    title: Merge ready
    uses: mohist/merge-ready
    with:
      baseBranch: ${{ repository.baseBranch }}
      source: ${{ workspace.branch }}
      remote: origin
      working-directory: REPOS/${{ repository.name }}
    recovery:
      budget: 1
      handlers:
      - when: canMerge=false
        tasks:
        - id: recover:rebase-onto-base
          title: Rebase onto base branch
          uses: mohist/rebase
          with:
            baseBranch: ${{ repository.baseBranch }}
            remote: origin
            working-directory: REPOS/${{ repository.name }}
          recovery:
            budget: 2
            handlers:
            - when: error.code=conflict
              tasks:
              - id: recover:resolve-rebase-conflicts
                title: Resolve rebase conflicts
                uses: mohist/agent
                with:
                  name: mohist/reviewer
                  session: check
                  prompt: ${{ prompts.resolve-rebase-conflicts }}
        retrySelf: true
  checks: []
- stage: integrate
  lockBehavior: sequential
  resources:
  - project-integration
  tasks:
  - id: workspace-prepare
    title: Prepare workspace
    uses: mohist/workspace-prepare
    with:
      expectedBranch: ${{ workspace.branch }}
      working-directory: REPOS/${{ repository.name }}
  - id: integrate:rebase
    title: Rebase and squash branch
    uses: mohist/rebase
    with:
      baseBranch: ${{ repository.baseBranch }}
      remote: origin
      squash: true
      messageFrom: issue.title
      working-directory: REPOS/${{ repository.name }}
    recovery:
      budget: 2
      handlers:
      - when: error.code=conflict
        tasks:
        - id: recover:resolve-rebase-conflicts
          title: Resolve rebase conflicts
          uses: mohist/agent
          with:
            name: mohist/builder
            session: integrate
            prompt: ${{ prompts.resolve-rebase-conflicts }}
  - id: integrate:push
    title: Push changes
    uses: mohist/push
    with:
      source: ${{ workspace.branch }}
      target: ${{ repository.baseBranch }}
      remote: origin
      working-directory: REPOS/${{ repository.name }}
  - id: integrate:health
    title: Health
    uses: core/script
    with:
      run: git diff --check
      timeout: 300000
      working-directory: REPOS/${{ repository.name }}
    recovery:
      budget: 1
      handlers:
      - when: error.code=script-failed
        tasks:
        - id: recover:fix-integrate-health
          title: Fix integrate health
          uses: mohist/agent
          with:
            name: mohist/builder
            session: integrate
            prompt: 'Fix the integrate-stage health failure reported by `git diff --check`.

              Keep changes focused on whitespace and patch formatting issues.

              '
        retrySelf: true
  checks: []
