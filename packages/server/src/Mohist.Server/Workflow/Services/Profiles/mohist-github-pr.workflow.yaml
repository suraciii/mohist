approval:
  feedback:
    tasks:
    - id: apply-feedback
      title: Apply approval feedback
      uses: mohist/agent
      with:
        name: mohist/builder
        session: feedback-${{ stage.name }}
        prompt: ${{ prompts.apply-feedback }}
    - id: publish-feedback
      title: Publish feedback
      uses: mohist/push
      with:
        source: HEAD
        target: ${{ workspace.branch }}
        remote: origin
        force: true
        working-directory: REPOS/${{ repository.name }}
recoveries:
  rebase-conflicts:
    budget: 2
    handlers:
    - when: error.code=conflict
      tasks:
      - id: recover:resolve-rebase-conflicts
        title: Resolve rebase conflicts
        uses: mohist/agent
        with:
          name: mohist/builder
          session: check
          prompt: ${{ prompts.resolve-rebase-conflicts }}
      retrySelf: false
stages:
- stage: plan
  requiresApproval: true
  tasks:
  - id: workspace-prepare
    title: Prepare workspace
    uses: mohist/workspace-prepare
    with:
      expectedBranch: ${{ workspace.branch }}
      working-directory: REPOS/${{ repository.name }}
  - id: plan
    title: Plan the change
    uses: mohist/agent
    with:
      name: mohist/planner
      session: plan
      prompt: ${{ prompts.plan }}
    expect:
      files:
      - path: PLANS/PLAN.md
      - path: PLANS/DESIGN.md
      - path: PLANS/tasks.json
    artifacts:
      files:
      - path: PLANS/PLAN.md
      - path: PLANS/DESIGN.md
      - path: PLANS/tasks.json
  - id: push
    title: Push
    uses: mohist/push
    with:
      source: HEAD
      target: ${{ workspace.branch }}
      remote: origin
      force: true
      working-directory: REPOS/${{ repository.name }}
  - id: open-draft-pr
    title: Open draft GitHub PR
    uses: mohist/create-github-pr
    with:
      repositoryUrl: ${{ repository.gitUrl }}
      source: ${{ workspace.branch }}
      target: ${{ repository.baseBranch }}
      draft: true
      titleFrom: issue.title
      bodyFrom: issue.body
      working-directory: REPOS/${{ repository.name }}
    setVars:
      github.pr.number: output.prNumber
      github.pr.url: output.prUrl
  checks: []
- stage: build
  tasks:
  - id: workspace-prepare
    title: Prepare workspace
    uses: mohist/workspace-prepare
    with:
      expectedBranch: ${{ workspace.branch }}
      working-directory: REPOS/${{ repository.name }}
  - id: load-tasks
    title: Load tasks from plan
    uses: mohist/task-list
    with:
      path: PLANS/tasks.json
      task:
        uses: mohist/agent
        with:
          name: mohist/builder
  - id: verify
    title: Verify
    uses: core/script
    with:
      run: ${{ workflow.verification.command }}
      timeout: 900000
      working-directory: REPOS/${{ repository.name }}
    recovery:
      budget: 2
      handlers:
      - when: error.code=script-failed
        tasks:
        - id: recover:fix-ci
          title: Fix CI verification
          uses: mohist/agent
          with:
            name: mohist/builder
            session: build
            prompt: ${{ prompts.fix-ci }}
        retrySelf: true
      - when: error.code=timeout
        tasks:
        - id: recover:fix-ci
          title: Fix CI verification
          uses: mohist/agent
          with:
            name: mohist/builder
            session: build
            prompt: ${{ prompts.fix-ci }}
        retrySelf: true
  - id: push
    title: Push
    uses: mohist/push
    with:
      source: HEAD
      target: ${{ workspace.branch }}
      remote: origin
      force: true
      working-directory: REPOS/${{ repository.name }}
  checks: []
- stage: check
  requiresApproval: true
  tasks:
  - id: workspace-prepare
    title: Prepare workspace
    uses: mohist/workspace-prepare
    with:
      expectedBranch: ${{ workspace.branch }}
      working-directory: REPOS/${{ repository.name }}
  - id: ai-review
    title: AI review
    uses: mohist/agent
    with:
      name: mohist/reviewer
      session: check
      prompt: ${{ prompts.review }}
    expect:
      files:
      - path: PLANS/REVIEW.md
    artifacts:
      files:
      - path: PLANS/REVIEW.md
  - id: rebase
    title: Rebase onto repository base
    uses: mohist/rebase
    with:
      baseBranch: ${{ repository.baseBranch }}
      remote: origin
      squash: false
      working-directory: REPOS/${{ repository.name }}
    recovery:
      budget: 2
      handlers:
      - when: error.code=conflict
        tasks:
        - id: recover:resolve-rebase-conflicts
          title: Resolve rebase conflicts
          uses: mohist/agent
          with:
            name: mohist/reviewer
            session: check
            prompt: ${{ prompts.resolve-rebase-conflicts }}
  - id: push
    title: Push
    uses: mohist/push
    with:
      source: HEAD
      target: ${{ workspace.branch }}
      remote: origin
      force: true
      working-directory: REPOS/${{ repository.name }}
  - id: mark-pr-ready
    title: Mark GitHub PR ready
    uses: mohist/mark-github-pr-ready
    with:
      repositoryUrl: ${{ repository.gitUrl }}
      prNumber: ${{ vars.github.pr.number }}
      working-directory: REPOS/${{ repository.name }}
  - id: verify-pr-checks
    title: Verify GitHub PR checks
    uses: mohist/github-pr-checks
    with:
      repositoryUrl: ${{ repository.gitUrl }}
      prNumber: ${{ vars.github.pr.number }}
      working-directory: REPOS/${{ repository.name }}
    recovery:
      budget: 2
      handlers:
      - when: error.code=pr-checks-failed
        tasks:
        - id: recover:fix-pr-checks
          title: Fix failing GitHub PR checks
          uses: mohist/agent
          with:
            name: mohist/reviewer
            session: check
            prompt: ${{ prompts.fix-pr-checks }}
        - id: recover:push
          title: Push
          uses: mohist/push
          with:
            source: HEAD
            target: ${{ workspace.branch }}
            remote: origin
            force: true
            working-directory: REPOS/${{ repository.name }}
        retrySelf: true
  checks:
  - id: github-pr-status
    title: GitHub PR status
    uses: mohist/github-pr-status
    with:
      repositoryUrl: ${{ repository.gitUrl }}
      prNumber: ${{ vars.github.pr.number }}
      working-directory: REPOS/${{ repository.name }}
- stage: integrate
  lockBehavior: sequential
  resources:
  - project-integration
  tasks:
  - id: workspace-prepare
    title: Prepare workspace
    uses: mohist/workspace-prepare
    with:
      expectedBranch: ${{ workspace.branch }}
      working-directory: REPOS/${{ repository.name }}
  - id: push
    title: Push
    uses: mohist/push
    with:
      source: HEAD
      target: ${{ workspace.branch }}
      remote: origin
      force: true
      working-directory: REPOS/${{ repository.name }}
  - id: enable-auto-merge
    title: Enable auto-merge
    uses: mohist/enable-github-pr-auto-merge
    with:
      repositoryUrl: ${{ repository.gitUrl }}
      prNumber: ${{ vars.github.pr.number }}
      method: squash
      working-directory: REPOS/${{ repository.name }}
    recovery:
      budget: 2
      handlers:
      - when: error.code=conflict
        tasks:
        - id: recover:rebase
          title: Rebase after base moved
          uses: mohist/rebase
          with:
            baseBranch: ${{ repository.baseBranch }}
            remote: origin
            squash: false
            working-directory: REPOS/${{ repository.name }}
          recovery:
            budget: 2
            handlers:
            - when: error.code=conflict
              tasks:
              - id: recover:resolve-rebase-conflicts
                title: Resolve rebase conflicts
                uses: mohist/agent
                with:
                  name: mohist/builder
                  session: integrate
                  prompt: ${{ prompts.resolve-rebase-conflicts }}
        - id: recover:push
          title: Push
          uses: mohist/push
          with:
            source: HEAD
            target: ${{ workspace.branch }}
            remote: origin
            force: true
            working-directory: REPOS/${{ repository.name }}
        retrySelf: true
      - when: error.code=pr-checks-failed
        tasks:
        - id: recover:fix-pr-checks
          title: Fix failing GitHub PR checks
          uses: mohist/agent
          with:
            name: mohist/builder
            session: integrate
            prompt: ${{ prompts.fix-pr-checks }}
        - id: recover:push
          title: Push
          uses: mohist/push
          with:
            source: HEAD
            target: ${{ workspace.branch }}
            remote: origin
            force: true
            working-directory: REPOS/${{ repository.name }}
        retrySelf: true
  checks:
  - id: merge-verified
    title: Merge verified
    uses: mohist/github-pr-status
    with:
      repositoryUrl: ${{ repository.gitUrl }}
      prNumber: ${{ vars.github.pr.number }}
      expect: merged
      working-directory: REPOS/${{ repository.name }}
