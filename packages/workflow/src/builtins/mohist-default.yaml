id: mohist/default
name: Mohist default issue delivery workflow

artifacts:
  openspecChange: "{{ openspec.changeDir }}"

stages:
  - id: plan
    approval: true
    on:
      plan.changed:
        reset:
          tasks: [self-review]
          checks: [self-review-passed]
          approval: true
    tasks:
      - id: proposal
        title: Generate proposal
        uses: mohist/agent
        with:
          session: plan-artifacts
          outputs: ["{{ artifacts.openspecChange }}/proposal.md"]
          prompt:
            inline: |-
              Create the proposal artifact for issue #{{ issue.number }}: {{ issue.title }}.

              Write the result to: {{ artifacts.openspecChange }}/proposal.md

              Use the existing change artifacts in {{ artifacts.openspecChange }} as context when relevant.

      - id: specs
        title: Write specs
        uses: mohist/agent
        with:
          session: plan-artifacts
          outputs: ["{{ artifacts.openspecChange }}/specs"]
          prompt:
            inline: |-
              Create the specs artifact for issue #{{ issue.number }}: {{ issue.title }}.

              Write the result to: {{ artifacts.openspecChange }}/specs

              Use the existing change artifacts in {{ artifacts.openspecChange }} as context when relevant.

      - id: design
        title: Create design
        uses: mohist/agent
        with:
          session: plan-artifacts
          outputs: ["{{ artifacts.openspecChange }}/design.md"]
          prompt:
            inline: |-
              Create the design artifact for issue #{{ issue.number }}: {{ issue.title }}.

              Write the result to: {{ artifacts.openspecChange }}/design.md

              Use the existing change artifacts in {{ artifacts.openspecChange }} as context when relevant.

      - id: tasks
        title: Generate tasks
        uses: mohist/agent
        with:
          session: plan-artifacts
          outputs: ["{{ artifacts.openspecChange }}/tasks.json"]
          prompt:
            inline: |-
              Create the tasks.json implementation plan artifact for issue #{{ issue.number }}: {{ issue.title }}.

              Write the result to: {{ artifacts.openspecChange }}/tasks.json

              Use the existing change artifacts in {{ artifacts.openspecChange }} as context when relevant.

      - id: self-review
        title: Self review
        uses: mohist/agent
        with:
          session: plan-artifacts
          outputs: ["{{ artifacts.openspecChange }}/self-review.md"]
          prompt:
            inline: |-
              Create the self-review artifact for issue #{{ issue.number }}: {{ issue.title }}.

              Write the result to: {{ artifacts.openspecChange }}/self-review.md

              Use the existing change artifacts in {{ artifacts.openspecChange }} as context when relevant.

              Review proposal.md, specs, design.md, and tasks.json.
              End the file with exactly one marker: <promise>PASS</promise> or <promise>FAIL</promise>.
          requiredMarkers:
            - path: "{{ artifacts.openspecChange }}/self-review.md"
              markers: ["<promise>PASS</promise>", "<promise>FAIL</promise>"]
              onMissing: { action: continue-session, maxAttempts: 1 }

    checks:
      - id: proposal-complete
        title: Proposal complete
        uses: mohist/artifact-exists
        with: { path: "{{ artifacts.openspecChange }}/proposal.md" }

      - id: specs-complete
        title: Specs complete
        uses: mohist/artifact-exists
        with: { path: "{{ artifacts.openspecChange }}/specs" }

      - id: design-complete
        title: Design complete
        uses: mohist/artifact-exists
        with: { path: "{{ artifacts.openspecChange }}/design.md" }

      - id: tasks-valid
        title: Tasks valid
        uses: mohist/artifact-exists
        with: { path: "{{ artifacts.openspecChange }}/tasks.json" }

      - id: self-review-passed
        title: Self review passed
        uses: mohist/marker
        with:
          path: "{{ artifacts.openspecChange }}/self-review.md"
          expect: "<promise>PASS</promise>"
          markers: ["<promise>PASS</promise>", "<promise>FAIL</promise>"]
          verdicts: { "<promise>PASS</promise>": PASS, "<promise>FAIL</promise>": FAIL }
          format: mohist/self-review
        onFailure:
          retry:
            limit: 1
            task:
              id: fix-plan-review
              title: Fix plan review findings
              uses: mohist/agent
              onSuccess: { emit: [plan.changed] }
              with:
                prompt:
                  inline: |-
                    Fix the plan review findings in:

                    {{ artifacts.openspecChange }}/self-review.md

                    Apply the minimal artifact changes required under:
                    {{ artifacts.openspecChange }}

                    Do not edit self-review.md.
                    The workflow will run self-review again after your artifact changes.

      - id: health:plan
        title: Plan health gate
        uses: mohist/health-gate
        with: { command: "npm ci && npm run typecheck", timeout: 300000 }

  - id: build
    tasksFrom:
      uses: mohist/openspec-tasks
      with:
        path: "{{ artifacts.openspecChange }}/tasks.json"
        task:
          uses: mohist/agent
          with:
            session: build
            prompt:
              inline: |-
                <task>
                  <id>{{ task.id }}</id>
                  <title>{{ task.title }}</title>
                  <description>{{ task.description }}</description>
                  <acceptanceCriteria>
                {{ task.acceptanceCriteria }}
                  </acceptanceCriteria>
                  <changeDir>{{ artifacts.openspecChange }}</changeDir>
                </task>

                Implement this task in the current worktree.
                Satisfy every acceptance criterion.
                Keep the change scoped to this task.
    checks:
      - id: health:build
        title: Build health gate
        uses: mohist/health-gate
        with: { command: "npm ci && npm run build", timeout: 300000 }
        onFailure:
          retry:
            limit: 1
            task:
              id: fix-build-health
              title: Fix build health
              uses: mohist/agent
              with:
                prompt:
                  inline: |-
                    Fix the build health failure.

                    Run or inspect the configured build command, apply the minimal code or artifact changes required, and avoid unrelated refactors.

  - id: check
    approval: true
    on:
      code.changed:
        reset:
          tasks: [ai-review]
          checks: all
          approval: true
    tasks:
      - id: ai-review
        title: AI review
        uses: mohist/check/ai-review
        with:
          requiredMarkers:
            - path: "{{ artifacts.openspecChange }}/review.md"
              markers: ["<promise>PASS</promise>", "<promise>FAIL</promise>"]
              onMissing: { action: continue-session, maxAttempts: 1 }
    checks:
      - id: health:check
        title: Check health gate
        uses: mohist/health-gate
        with: { command: "npm ci && npm run build && npm test", timeout: 300000 }
        onFailure:
          retry:
            limit: 1
            task:
              id: fix-check-health
              title: Fix check health
              uses: mohist/agent
              with:
                prompt:
                  inline: |-
                    Fix the check health failure.

                    Run or inspect the configured check command, apply the minimal code changes required, and avoid unrelated refactors.

      - id: review-passed
        title: Review passed
        uses: mohist/marker
        with:
          path: "{{ artifacts.openspecChange }}/review.md"
          expect: "<promise>PASS</promise>"
          markers: ["<promise>PASS</promise>", "<promise>FAIL</promise>"]
          verdicts: { "<promise>PASS</promise>": PASS, "<promise>FAIL</promise>": FAIL }
          format: mohist/review
        onFailure:
          retry:
            limit: 2
            task:
              id: fix-review-findings
              title: Fix review findings
              uses: mohist/agent
              with:
                prompt:
                  inline: |-
                    Fix the blocking findings in:

                    {{ artifacts.openspecChange }}/review.md

                    Apply the minimal code changes required.
                    Do not edit review.md.

      - id: merge-ready
        title: Merge ready
        uses: mohist/merge-ready
        onFailure:
          retry:
            limit: 1
            task:
              id: fix-merge-readiness
              title: Fix merge readiness
              uses: mohist/rebase

  - id: integrate
    tasks:
      - id: integrate:spec-sync
        title: Sync specs
        uses: mohist/openspec-sync

      - id: integrate:archive-change
        title: Archive change
        uses: mohist/archive-change

      - id: integrate:merge
        title: Merge branch
        uses: mohist/merge

    checks:
      - id: health:integrate
        title: Post-delivery health check
        uses: mohist/health-gate
        with: { command: "npm ci && npm run build && npm test", timeout: 300000 }
        onFailure:
          retry:
            limit: 1
            task:
              id: fix-integrate-health
              title: Fix integrate health
              uses: mohist/agent
              with:
                prompt:
                  inline: |-
                    Fix the post-delivery health failure.

                    Apply the minimal changes required after integration side effects. Preserve already completed delivery work unless correcting the health failure requires it.
