# Mohist Server —— container orchestration for self-hosting.
#
# Brings up just the server (the web SPA is baked into the image, the runner is
# meant to keep running on the host — it needs your git repos, opencode, and
# shell tools that don't belong inside a container).
#
#   docker compose up -d
#
# Then point a host-side runner at it:
#   SERVER_URL=http://localhost:3456
#
# ⚠️  Mohist has NO built-in auth. Do NOT publish port 3456 directly to the
# internet. Put an auth proxy (Caddy/nginx + auth, see docs/self-host.md "远程
# 访问") in front, or reach it over a VPN (Tailscale/WireGuard).

services:
  mohist-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: mohist-server:local
    container_name: mohist-server
    restart: unless-stopped

    ports:
      - "3456:3456"

    environment:
      # Listening config — override freely.
      ASPNETCORE_URLS: http://0.0.0.0:3456

    volumes:
      # Named volume — Docker manages ownership/permissions, the simplest choice
      # for self-hosting. All state lands under /data/.mohist/ because the
      # Dockerfile sets HOME=/data.
      - mohist-data:/data
      # ── Bind-mount alternative (better if you want direct host access to the
      # ── data dir for backups). Requires the host dir to be writable by uid
      # ── 1001 (the container user), e.g. `sudo chown -R 1001:1001 ./data`:
      # - ./data:/data

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3456/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  mohist-data:
