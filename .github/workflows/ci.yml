name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build and test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY: false
      DOTNET_GENERATE_ASPNET_CERT: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Project uses Central Package Management (Directory.Packages.props) with
      # no packages.lock.json, so setup-dotnet's `cache: true` (which requires a
      # lock file) cannot be used. Cache the restored NuGet global packages
      # folder keyed on the props hash instead, to skip re-downloading ~120
      # packages from nuget.org on every run.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Mohist.sln

      - name: Build
        run: dotnet build Mohist.sln -p:SkipWebBuild=true --no-restore

      - name: Test
        run: dotnet test Mohist.sln -p:SkipWebBuild=true --no-build
        timeout-minutes: 5

  node:
    name: Node build and test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve Node test budget base
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          base_ref=""
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_ref="$PR_BASE_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            base_ref="$PUSH_BEFORE_SHA"
          fi

          if [[ -z "$base_ref" || "$base_ref" =~ ^0+$ ]]; then
            base_ref="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi

          git rev-parse --verify "${base_ref}^{commit}" >/dev/null
          printf 'NODE_TEST_BUDGET_BASE_REF=%s\n' "$base_ref" >> "$GITHUB_ENV"

      - name: Check Node architecture scripts
        run: |
          npm run archtest

      - name: Build
        run: npm run build --workspaces --if-present

      - name: Test runner
        run: npm run test:ci -w packages/runner

      - name: Test runner integration
        run: npm run test:integration -w packages/runner

      - name: Test web
        run: npm run test:ci -w packages/web
