name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY: false
      DOTNET_GENERATE_ASPNET_CERT: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Project uses Central Package Management (Directory.Packages.props) with
      # no packages.lock.json, so setup-dotnet's `cache: true` (which requires a
      # lock file) cannot be used. Cache the restored NuGet global packages
      # folder keyed on the props hash instead, to skip re-downloading ~120
      # packages from nuget.org on every run.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Mohist.sln

      - name: Build
        run: dotnet build Mohist.sln -p:SkipWebBuild=true --no-restore

      - name: Test
        run: dotnet test Mohist.sln -p:SkipWebBuild=true --no-build
        timeout-minutes: 10

  # Build（含 tsc typecheck 门槛）与测试互不依赖——vitest 直接跑 TS 源码，
  # 不需要 dist。拆成并行 job 让测试不用等 build。
  node-build:
    name: Node build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --workspaces --if-present

  runner-test:
    name: Runner tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test:ci -w packages/runner

  web-test:
    name: Web tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test:ci -w packages/web

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    needs: [dotnet, node-build, runner-test, web-test]
    if: always()
    steps:
      - run: |
          if [ "${{ needs.dotnet.result }}" != "success" ] || [ "${{ needs['node-build'].result }}" != "success" ] || [ "${{ needs['runner-test'].result }}" != "success" ] || [ "${{ needs['web-test'].result }}" != "success" ]; then
            exit 1
          fi
