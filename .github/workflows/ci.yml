name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# The Spec suite is split across four independent jobs. Each job discovers the
# same compiled class list, selects a deterministic disjoint subset, and keeps
# the existing xUnit collection and thread limits. A final job verifies that
# the partition manifests cover every discovered class exactly once.
jobs:
  dotnet-spec:
    name: .NET spec tests (partition ${{ matrix.partition }})
    strategy:
      fail-fast: false
      matrix:
        partition: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY: false
      DOTNET_GENERATE_ASPNET_CERT: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Project uses Central Package Management (Directory.Packages.props) with
      # no packages.lock.json, so setup-dotnet's `cache: true` (which requires a
      # lock file) cannot be used. Cache the restored NuGet global packages
      # folder keyed on the props hash instead, to skip re-downloading ~120
      # packages from nuget.org on every run.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: timeout --signal=TERM --kill-after=30s 300s dotnet restore Mohist.sln

      - name: Build
        run: timeout --signal=TERM --kill-after=30s 300s dotnet build packages/server/tests/Mohist.Server.SpecTests/Mohist.Server.SpecTests.csproj -p:SkipWebBuild=true --no-restore

      - name: Test Spec partition
        run: |
          timeout --signal=TERM -k 10s 240s ./scripts/ci-spec-partition.sh run \
            packages/server/tests/Mohist.Server.SpecTests/bin/Debug/net11.0/Mohist.Server.SpecTests \
            "${{ matrix.partition }}" "${{ strategy.job-total }}" \
            "artifacts/spec-partition-${{ matrix.partition }}" \
            "artifacts/spec-partition-${{ matrix.partition }}/spec.trx"
        timeout-minutes: 5

      - name: Upload Spec partition artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-spec-partition-${{ matrix.partition }}-${{ github.run_attempt }}
          path: artifacts/spec-partition-${{ matrix.partition }}
          if-no-files-found: error
          retention-days: 7

  dotnet-spec-coverage:
    name: .NET spec coverage
    needs: dotnet-spec
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Spec partition artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dotnet-spec-partition-*-${{ github.run_attempt }}
          path: artifacts/spec-partitions
          merge-multiple: false

      - name: Verify complete Spec coverage
        run: timeout --signal=TERM -k 10s 60s ./scripts/ci-spec-partition.sh verify artifacts/spec-partitions

  dotnet-core:
    name: .NET build and test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY: false
      DOTNET_GENERATE_ASPNET_CERT: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: timeout --signal=TERM --kill-after=30s 300s dotnet restore Mohist.sln

      - name: Build
        run: timeout --signal=TERM --kill-after=30s 300s dotnet build Mohist.sln -p:SkipWebBuild=true --no-restore

      - name: Test
        run: |
          timeout --signal=TERM --kill-after=30s 300s dotnet test packages/server/tests/Mohist.Workflow.Definition.Tests/Mohist.Workflow.Definition.Tests.csproj -p:SkipWebBuild=true --no-build
          timeout --signal=TERM --kill-after=30s 300s dotnet test packages/cli/tests/Mohist.Cli.Tests/Mohist.Cli.Tests.csproj -p:SkipWebBuild=true --no-build
          timeout --signal=TERM --kill-after=30s 300s dotnet test packages/server/tests/Mohist.Server.UnitTests/Mohist.Server.UnitTests.csproj -p:SkipWebBuild=true --no-build
          timeout --signal=TERM --kill-after=30s 300s dotnet test packages/server/tests/Mohist.Server.ArchTests/Mohist.Server.ArchTests.csproj -p:SkipWebBuild=true --no-build
        timeout-minutes: 5

      - name: Upload failed test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-core-test-results-${{ github.run_attempt }}
          path: "**/TestResults/*.log"
          if-no-files-found: warn
          retention-days: 7

  node:
    name: Node build and test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: timeout --signal=TERM --kill-after=30s 300s npm ci

      - name: Resolve file size ratchet base
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          base_ref=""
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_ref="$PR_BASE_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            base_ref="$PUSH_BEFORE_SHA"
          fi

          if [[ -z "$base_ref" || "$base_ref" =~ ^0+$ ]]; then
            base_ref="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi

          git rev-parse --verify "${base_ref}^{commit}" >/dev/null
          printf 'FILE_SIZE_BASE_REF=%s\n' "$base_ref" >> "$GITHUB_ENV"

      - name: Check file sizes
        run: timeout --signal=TERM --kill-after=30s 60s npm run check:filesizes

      - name: Check Node architecture scripts
        run: |
          timeout --signal=TERM --kill-after=30s 180s npm run archtest

      - name: Check active documentation
        run: timeout --signal=TERM --kill-after=30s 180s npm run docs:check

      - name: Build
        run: timeout --signal=TERM --kill-after=30s 300s npm run build --workspaces --if-present

      - name: Test runner
        run: timeout --signal=TERM --kill-after=30s 180s npm run test:ci -w packages/runner

      - name: Test runner integration
        run: timeout --signal=TERM --kill-after=30s 180s npm run test:integration -w packages/runner

      - name: Test web
        run: timeout --signal=TERM --kill-after=30s 180s npm run test:ci -w packages/web
