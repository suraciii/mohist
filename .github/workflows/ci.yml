name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY: false
  DOTNET_GENERATE_ASPNET_CERT: false

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TMPDIR: /tmp/mohist-scope
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install dependencies
        run: npm ci

      - name: Restore .NET
        run: dotnet restore Mohist.sln

      - name: Run Server scope
        run: |
          mkdir -p "$TMPDIR" artifacts/server
          npm run test:app -- server

      - name: Capture Server evidence
        if: always()
        shell: bash
        run: |
          scope_root="$(find "$TMPDIR" -mindepth 1 -maxdepth 1 -type d -name 'mohist-canonical-gate-*' -print -quit 2>/dev/null || true)"
          if [[ -n "$scope_root" ]]; then cp -a "$scope_root"/. artifacts/server/; fi

      - name: Upload Server evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scope-server
          path: artifacts
          if-no-files-found: warn
          retention-days: 7

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TMPDIR: /tmp/mohist-scope
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Web scope
        run: |
          mkdir -p "$TMPDIR" artifacts/web
          npm run test:app -- web

      - name: Capture Web evidence
        if: always()
        shell: bash
        run: |
          scope_root="$(find "$TMPDIR" -mindepth 1 -maxdepth 1 -type d -name 'mohist-canonical-gate-*' -print -quit 2>/dev/null || true)"
          if [[ -n "$scope_root" ]]; then cp -a "$scope_root"/. artifacts/web/; fi

      - name: Upload Web evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scope-web
          path: artifacts
          if-no-files-found: warn
          retention-days: 7

  cli:
    name: CLI
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TMPDIR: /tmp/mohist-scope
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install dependencies
        run: npm ci

      - name: Restore .NET
        run: dotnet restore Mohist.sln

      - name: Run CLI scope
        run: |
          mkdir -p "$TMPDIR" artifacts/cli
          npm run test:app -- cli

      - name: Capture CLI evidence
        if: always()
        shell: bash
        run: |
          scope_root="$(find "$TMPDIR" -mindepth 1 -maxdepth 1 -type d -name 'mohist-canonical-gate-*' -print -quit 2>/dev/null || true)"
          if [[ -n "$scope_root" ]]; then cp -a "$scope_root"/. artifacts/cli/; fi

      - name: Upload CLI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scope-cli
          path: artifacts
          if-no-files-found: warn
          retention-days: 7

  runner:
    name: Runner
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TMPDIR: /tmp/mohist-scope
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Runner scope
        run: |
          mkdir -p "$TMPDIR" artifacts/runner
          npm run test:app -- runner

      - name: Capture Runner evidence
        if: always()
        shell: bash
        run: |
          scope_root="$(find "$TMPDIR" -mindepth 1 -maxdepth 1 -type d -name 'mohist-canonical-gate-*' -print -quit 2>/dev/null || true)"
          if [[ -n "$scope_root" ]]; then cp -a "$scope_root"/. artifacts/runner/; fi

      - name: Upload Runner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scope-runner
          path: artifacts
          if-no-files-found: warn
          retention-days: 7

  slack:
    name: Slack
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TMPDIR: /tmp/mohist-scope
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Slack scope
        run: |
          mkdir -p "$TMPDIR" artifacts/slack
          npm run test:app -- slack

      - name: Capture Slack evidence
        if: always()
        shell: bash
        run: |
          scope_root="$(find "$TMPDIR" -mindepth 1 -maxdepth 1 -type d -name 'mohist-canonical-gate-*' -print -quit 2>/dev/null || true)"
          if [[ -n "$scope_root" ]]; then cp -a "$scope_root"/. artifacts/slack/; fi

      - name: Upload Slack evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scope-slack
          path: artifacts
          if-no-files-found: warn
          retention-days: 7

  repository:
    name: Repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TMPDIR: /tmp/mohist-scope
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Repository scope
        run: |
          mkdir -p "$TMPDIR" artifacts/repository
          node --import tsx scripts/test-duration/repository.ts

      - name: Capture Repository evidence
        if: always()
        shell: bash
        run: |
          scope_root="$(find "$TMPDIR" -mindepth 1 -maxdepth 1 -type d -name 'mohist-canonical-gate-*' -print -quit 2>/dev/null || true)"
          if [[ -n "$scope_root" ]]; then cp -a "$scope_root"/. artifacts/repository/; fi

      - name: Upload Repository evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scope-repository
          path: artifacts
          if-no-files-found: warn
          retention-days: 7

  gate:
    name: Gate
    if: always()
    needs: [server, web, cli, runner, slack, repository]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download scope evidence
        uses: actions/download-artifact@v5
        with:
          pattern: scope-*
          path: artifacts
          merge-multiple: true

      - name: Aggregate evidence
        run: node --import tsx scripts/test-duration/gate.ts --evidence-root "$GITHUB_WORKSPACE/artifacts"
