name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Mohist.sln -p:SkipWebBuild=true

      - name: Test
        run: dotnet test Mohist.sln -p:SkipWebBuild=true --no-build

  node:
    name: Node build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --workspaces --if-present

      - name: Test
        run: npm run test:ci --workspaces --if-present

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    needs: [dotnet, node]
    if: always()
    steps:
      - run: |
          if [ "${{ needs.dotnet.result }}" != "success" ] || [ "${{ needs.node.result }}" != "success" ]; then
            exit 1
          fi
