name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# CI deliberately invokes the same canonical entry point as a local final gate.
# It must not reconstruct duration evidence from independently restored/built
# jobs, because that changes the resource ownership and duration environment.
jobs:
  canonical:
    name: Canonical verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY: false
      DOTNET_GENERATE_ASPNET_CERT: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Central Package Management has no packages.lock.json, so cache the
      # restored global packages folder by its authoritative package graph.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install dependencies
        run: timeout -k 10s 120s npm ci

      - name: Run canonical gate
        # TERM starts at 240s and KILL follows after ten seconds. The remaining
        # job wall belongs to checkout, setup, install, and diagnostic upload.
        timeout-minutes: 5
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: timeout -k 10s 240s npm run verify

      - name: Upload canonical diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-gate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mohist-canonical-gate-*
          if-no-files-found: warn
          retention-days: 7
