name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# A superseded push to the same PR cancels the obsolete run instead of
# finishing side by side with the fresh one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CI deliberately invokes the same canonical entry point as a local final gate.
# It must not reconstruct duration evidence from independently restored/built
# jobs, because that changes the resource ownership and duration environment.
jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet }}
      node: ${{ steps.filter.outputs.node }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          base_ref=""
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_ref="$PR_BASE_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            base_ref="$PUSH_BEFORE_SHA"
          fi

          if [[ -z "$base_ref" || "$base_ref" =~ ^0+$ ]] || ! git rev-parse --verify "${base_ref}^{commit}" >/dev/null 2>&1; then
            echo "No comparable base; running every track."
            echo "dotnet=true" >> "$GITHUB_OUTPUT"
            echo "node=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          dotnet=false
          node=false
          while IFS= read -r file; do
            case "$file" in
              packages/server/*|packages/cli/*|Mohist.sln|Directory.Build.props|Directory.Packages.props|global.json|eng/*|.github/workflows/ci.yml)
                dotnet=true ;;
            esac
            case "$file" in
              packages/web/*|packages/runner/*|packages/mohist-slack/*|package.json|package-lock.json|tsconfig*.json|biome.json|scripts/*|docs/*|design/*|*.md|.github/workflows/ci.yml)
                node=true ;;
            esac
          done <<< "$(git diff --name-only "$base_ref"...HEAD)"

          echo "dotnet=$dotnet" >> "$GITHUB_OUTPUT"
          echo "node=$node" >> "$GITHUB_OUTPUT"

  canonical:
    name: Canonical verification
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.dotnet == 'true' || needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    # The canonical gate has its own five-minute absolute deadline. Keep
    # setup, cold restore/build, diagnostics, and process-tree cleanup outside
    # that measured budget so the job cannot cancel a still-running gate.
    timeout-minutes: 7
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY: false
      DOTNET_GENERATE_ASPNET_CERT: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Central Package Management has no packages.lock.json, so cache the
      # restored global packages folder by its authoritative package graph.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install dependencies
        run: timeout -k 10s 120s npm ci

      - name: Resolve file size ratchet base
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          base_ref=""
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_ref="$PR_BASE_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            base_ref="$PUSH_BEFORE_SHA"
          fi

          if [[ -z "$base_ref" || "$base_ref" =~ ^0+$ ]]; then
            base_ref="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi

          git rev-parse --verify "${base_ref}^{commit}" >/dev/null
          printf 'FILE_SIZE_BASE_REF=%s\n' "$base_ref" >> "$GITHUB_ENV"

      - name: Check format
        run: timeout --signal=TERM --kill-after=30s 60s npm run format:check

      - name: Run canonical gate
        # TERM starts at 270s and KILL follows after ten seconds. The remaining
        # job wall belongs to checkout, setup, install, and diagnostic upload;
        # the job timeout above is only an outer setup/cleanup margin.
        # npm run verify first executes the master file-size ratchet, then the
        # canonical scheduler.
        timeout-minutes: 5
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: timeout -k 10s 270s npm run verify

      - name: Upload canonical diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-gate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mohist-canonical-gate-*
          if-no-files-found: warn
          retention-days: 7
