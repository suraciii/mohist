name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"

jobs:
  # Path filtering keeps runner time proportional to what a PR actually
  # touches. Non-PR events (push, dispatch) always run every scope; the
  # dependency map below mirrors the real build graph, including the
  # Server <-> CLI project-reference coupling.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      global: ${{ steps.filter.outputs.global }}
      server: ${{ steps.filter.outputs.server }}
      cli: ${{ steps.filter.outputs.cli }}
      web: ${{ steps.filter.outputs.web }}
      runner: ${{ steps.filter.outputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect changed scopes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            global:
              - '.github/workflows/**'
              - 'scripts/**'
              - 'eng/**'
              - 'Directory.Build.props'
              - 'global.json'
              - 'package.json'
              - 'package-lock.json'
              - 'test-duration.config.jsonc'
              - 'Mohist.sln'
              - 'Mohist.Server.Tests.slnf'
            server:
              - 'packages/server/**'
              - 'packages/cli/**'
            cli:
              - 'packages/cli/**'
              - 'packages/server/src/Mohist.Workflow.Definition/**'
            web:
              - 'packages/web/**'
            runner:
              - 'packages/runner/**'

  server:
    name: Server
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.global == 'true' || needs.changes.outputs.server == 'true'
    # Outer failsafe: must exceed the suite deadline (420 s) plus checkout,
    # toolchain setup, and evidence capture.
    timeout-minutes: 12
    env:
      TMPDIR: /tmp/mohist-scope
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install dependencies
        run: npm ci

      - name: Restore .NET
        run: dotnet restore Mohist.sln

      - name: Run Server scope
        run: |
          mkdir -p "$TMPDIR" artifacts/server
          npm run test:app -- server

      - name: Capture Server evidence
        if: always()
        shell: bash
        run: |
          scope_root="$(find "$TMPDIR" -mindepth 1 -maxdepth 1 -type d -name 'mohist-canonical-gate-*' -print -quit 2>/dev/null || true)"
          if [[ -n "$scope_root" ]]; then cp -a "$scope_root"/. artifacts/server/; fi

      - name: Upload Server evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scope-server
          path: artifacts
          if-no-files-found: warn
          retention-days: 7

  web:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.global == 'true' || needs.changes.outputs.web == 'true'
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TMPDIR: /tmp/mohist-scope
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Web scope
        run: |
          mkdir -p "$TMPDIR" artifacts/web
          npm run test:app -- web

      - name: Capture Web evidence
        if: always()
        shell: bash
        run: |
          scope_root="$(find "$TMPDIR" -mindepth 1 -maxdepth 1 -type d -name 'mohist-canonical-gate-*' -print -quit 2>/dev/null || true)"
          if [[ -n "$scope_root" ]]; then cp -a "$scope_root"/. artifacts/web/; fi

      - name: Upload Web evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scope-web
          path: artifacts
          if-no-files-found: warn
          retention-days: 7

  cli:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.global == 'true' || needs.changes.outputs.cli == 'true'
    name: CLI
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TMPDIR: /tmp/mohist-scope
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install dependencies
        run: npm ci

      - name: Restore .NET
        run: dotnet restore Mohist.sln

      - name: Run CLI scope
        run: |
          mkdir -p "$TMPDIR" artifacts/cli
          npm run test:app -- cli

      - name: Capture CLI evidence
        if: always()
        shell: bash
        run: |
          scope_root="$(find "$TMPDIR" -mindepth 1 -maxdepth 1 -type d -name 'mohist-canonical-gate-*' -print -quit 2>/dev/null || true)"
          if [[ -n "$scope_root" ]]; then cp -a "$scope_root"/. artifacts/cli/; fi

      - name: Upload CLI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scope-cli
          path: artifacts
          if-no-files-found: warn
          retention-days: 7

  runner:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.global == 'true' || needs.changes.outputs.runner == 'true'
    name: Runner
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TMPDIR: /tmp/mohist-scope
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Runner scope
        run: |
          mkdir -p "$TMPDIR" artifacts/runner
          npm run test:app -- runner

      - name: Capture Runner evidence
        if: always()
        shell: bash
        run: |
          scope_root="$(find "$TMPDIR" -mindepth 1 -maxdepth 1 -type d -name 'mohist-canonical-gate-*' -print -quit 2>/dev/null || true)"
          if [[ -n "$scope_root" ]]; then cp -a "$scope_root"/. artifacts/runner/; fi

      - name: Upload Runner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scope-runner
          path: artifacts
          if-no-files-found: warn
          retention-days: 7

  repository:
    name: Repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TMPDIR: /tmp/mohist-scope
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: packages/go/mohist-slack/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Race-test Slack adapter
        run: npm run test:slack:race

      - name: Run Repository scope
        run: |
          mkdir -p "$TMPDIR" artifacts/repository
          node --import tsx scripts/test-duration/repository.ts

      - name: Capture Repository evidence
        if: always()
        shell: bash
        run: |
          scope_root="$(find "$TMPDIR" -mindepth 1 -maxdepth 1 -type d -name 'mohist-canonical-gate-*' -print -quit 2>/dev/null || true)"
          if [[ -n "$scope_root" ]]; then cp -a "$scope_root"/. artifacts/repository/; fi

      - name: Upload Repository evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scope-repository
          path: artifacts
          if-no-files-found: warn
          retention-days: 7

  gate:
    name: Gate
    if: always()
    needs: [changes, server, web, cli, runner, repository]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download scope evidence
        uses: actions/download-artifact@v5
        with:
          pattern: scope-*
          path: artifacts
          merge-multiple: true
      - name: Aggregate evidence
        env:
          # The authoritative skip manifest is the jobs' own outcomes — no
          # separate bookkeeping to keep in sync.
          SKIPPED_SCOPES: >-
            ${{ needs.server.result == 'skipped' && 'server' || '' }}
            ${{ needs.cli.result == 'skipped' && 'cli' || '' }}
            ${{ needs.web.result == 'skipped' && 'web' || '' }}
            ${{ needs.runner.result == 'skipped' && 'runner' || '' }}
        run: node --import tsx scripts/test-duration/gate.ts --evidence-root "$GITHUB_WORKSPACE/artifacts" --skipped-scopes "$SKIPPED_SCOPES"